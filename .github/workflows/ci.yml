name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (skip the Windows-only MetaTrader5 package)
        run: |
          grep -vi '^metatrader5' requirements.txt > requirements-ci.txt
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Create throwaway test configuration (no real secrets)
        run: |
          {
            echo "ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
            echo "SECRET_KEY=ci-only-not-a-real-secret"
            echo "ALGORITHM=HS256"
            echo "ACCESS_TOKEN_EXPIRE_MINUTES=60"
            echo "DATABASE_URL=sqlite:///./ci_test.db"
            echo "APP_NAME=TradePilot AI CI"
            echo "APP_VERSION=ci"
            echo "DEBUG=false"
            echo "GEMINI_API_KEY=ci-not-a-real-key"
            echo "GEMINI_MODEL=gemini-3.6-flash"
            echo "OPENAI_API_KEY=ci-not-a-real-key"
            echo "OPENAI_MODEL=gpt-4o-mini"
            echo "PAYPAL_ENV=sandbox"
            echo "PAYPAL_CLIENT_ID=ci-not-a-real-id"
            echo "PAYPAL_SECRET=ci-not-a-real-secret"
            echo "PAYPAL_PRODUCT_ID=ci-not-a-real-id"
            echo "PAYPAL_PRO_PLAN_ID=ci-not-a-real-id"
            echo "PAYPAL_PREMIUM_PLAN_ID=ci-not-a-real-id"
          } >> "$GITHUB_ENV"

      - name: Run tests
        run: python -m pytest tests -q

  frontend:
    name: Frontend build and macro tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Macro engine tests
        run: npm test

      - name: Type-check and build
        run: npm run build